<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Team Task Manager – project board view." />
  <title>Project – TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="app-page">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <button id="back-btn" class="btn-ghost icon-only" title="Back to Dashboard">←</button>
      <span class="nav-logo">⚡</span>
      <span class="nav-title">TaskFlow</span>
    </div>
    <div class="nav-right">
      <span class="nav-user">👤 <span id="user-name">User</span></span>
      <button id="logout-btn" class="btn-ghost">Logout</button>
    </div>
  </nav>

  <div class="project-page">

    <!-- Project Header -->
    <div class="project-header">
      <div class="project-header-info">
        <h1 id="proj-title" class="project-h1">Loading…</h1>
        <p id="proj-desc-text" class="project-h1-desc"></p>
      </div>
      <div class="project-header-actions">
        <button id="manage-members-btn" class="btn-secondary admin-only hidden">👥 Members</button>
        <button id="add-task-btn"       class="btn-primary admin-only hidden">+ Add Task</button>
      </div>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-board">

      <!-- To Do -->
      <div class="kanban-col" data-status="todo">
        <div class="kanban-col-header todo-header">
          <span class="col-dot todo-dot"></span>
          <h3>To Do</h3>
          <span class="col-count" id="count-todo"></span>
        </div>
        <div class="kanban-col-body" id="col-todo">
          <div class="empty-col">Loading…</div>
        </div>
      </div>

      <!-- In Progress -->
      <div class="kanban-col" data-status="in_progress">
        <div class="kanban-col-header progress-header">
          <span class="col-dot progress-dot"></span>
          <h3>In Progress</h3>
          <span class="col-count" id="count-in-progress"></span>
        </div>
        <div class="kanban-col-body" id="col-in-progress">
          <div class="empty-col">Loading…</div>
        </div>
      </div>

      <!-- Done -->
      <div class="kanban-col" data-status="done">
        <div class="kanban-col-header done-header">
          <span class="col-dot done-dot"></span>
          <h3>Done</h3>
          <span class="col-count" id="count-done"></span>
        </div>
        <div class="kanban-col-body" id="col-done">
          <div class="empty-col">Loading…</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Task Modal ─────────────────────────────────────────────────────────── -->
  <div id="task-modal" class="modal-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="task-modal-title">New Task</h2>
        <button id="task-modal-close" class="modal-close">✕</button>
      </div>
      <form id="task-form">
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="task-title">Title *</label>
            <input id="task-title" type="text" placeholder="Task title" required />
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" rows="3" placeholder="Task details…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="task-due-date">Due Date</label>
            <input id="task-due-date" type="date" />
          </div>
          <div class="form-group flex-1">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="todo">📋 To Do</option>
              <option value="in_progress">⚡ In Progress</option>
              <option value="done">✅ Done</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="task-assignee">Assign To</label>
            <select id="task-assignee">
              <option value="">— Unassigned —</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="task-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Member Modal ───────────────────────────────────────────────────────── -->
  <div id="member-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Manage Members</h2>
        <button id="member-modal-close" class="modal-close">✕</button>
      </div>

      <!-- Current members list -->
      <div id="members-list" class="members-list">
        <!-- dynamic -->
      </div>

      <!-- Add member form (admin only) -->
      <div class="admin-only" id="add-member-section">
        <hr class="divider" />
        <h3 class="sub-title">Add Member</h3>
        <form id="member-form">
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="member-email">Email</label>
              <input id="member-email" type="email" placeholder="member@example.com" required />
            </div>
            <div class="form-group">
              <label for="member-role">Role</label>
              <select id="member-role">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn-primary full-width">Add Member</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/project.js"></script>
  <script>
    // Wire up task cancel button
    document.getElementById('task-cancel').addEventListener('click', () => {
      document.getElementById('task-modal').classList.remove('open');
    });
  </script>
</body>
</html>
