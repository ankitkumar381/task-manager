<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WorkSwift - your project dashboard." />
  <title>Dashboard - WorkSwift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">

  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-logo app-mark" aria-hidden="true"></span>
      <span class="nav-title">WorkSwift</span>
    </div>
    <div class="nav-right">
      <span class="nav-user"><span class="mini-icon icon-user" aria-hidden="true"></span><span id="user-name">User</span></span>
      <button id="logout-btn" class="btn-ghost">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <p class="sidebar-label">Menu</p>
        <a href="/dashboard.html" class="sidebar-link active">
          <span class="sidebar-icon icon-grid" aria-hidden="true"></span>
          Dashboard
        </a>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-label">Projects</p>
        <div id="sidebar-projects" class="sidebar-projects"></div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header dashboard-hero">
        <div>
          <p class="eyebrow">Workspace overview</p>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Track your team workload, recent movement, and project health.</p>
        </div>
        <button id="create-project-btn" class="btn-primary">
          <span class="btn-icon icon-plus" aria-hidden="true"></span>
          New Project
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card card-blue">
          <div class="stat-icon icon-stack" aria-hidden="true"></div>
          <div class="stat-body">
            <span class="stat-label">Total Tasks</span>
            <span class="stat-value" id="stat-total">-</span>
          </div>
        </div>
        <div class="stat-card card-purple">
          <div class="stat-icon icon-bolt" aria-hidden="true"></div>
          <div class="stat-body">
            <span class="stat-label">In Progress</span>
            <span class="stat-value" id="stat-progress">-</span>
          </div>
        </div>
        <div class="stat-card card-green">
          <div class="stat-icon icon-check" aria-hidden="true"></div>
          <div class="stat-body">
            <span class="stat-label">Completed</span>
            <span class="stat-value" id="stat-done">-</span>
          </div>
        </div>
        <div class="stat-card card-red">
          <div class="stat-icon icon-alert" aria-hidden="true"></div>
          <div class="stat-body">
            <span class="stat-label">Overdue</span>
            <span class="stat-value" id="stat-overdue">-</span>
          </div>
        </div>
      </div>

      <div class="two-col-grid">
        <div class="card chart-card">
          <div class="card-heading">
            <h2 class="card-title">Tasks Per User</h2>
            <span class="card-kicker">Live</span>
          </div>
          <div class="chart-wrapper">
            <canvas id="tasks-chart"></canvas>
          </div>
        </div>
        <div class="card">
          <div class="card-heading">
            <h2 class="card-title">Recent Tasks</h2>
            <span class="card-kicker">Latest</span>
          </div>
          <div id="recent-tasks-list" class="recent-list">
            <p class="no-data">Loading...</p>
          </div>
        </div>
      </div>

      <div class="section-header">
        <div>
          <p class="eyebrow">Boards</p>
          <h2 class="section-title">My Projects</h2>
        </div>
      </div>
      <div id="project-list" class="projects-grid">
        <div class="loading-grid">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="project-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Create</p>
          <h2>New Project</h2>
        </div>
        <button id="proj-modal-close" class="modal-close" aria-label="Close">x</button>
      </div>
      <form id="project-form">
        <div class="form-group">
          <label for="proj-name">Project Name *</label>
          <input id="proj-name" type="text" placeholder="e.g. Website Redesign" required />
        </div>
        <div class="form-group">
          <label for="proj-desc">Description</label>
          <textarea id="proj-desc" rows="3" placeholder="What is this project about?"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" onclick="document.getElementById('project-modal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
